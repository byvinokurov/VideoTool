spring:
  application:
    name: ReelsProject
  # --- Временно, пока в проекте нет ни одной @Entity и БД не используется ---
  docker:
    compose:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

telegram:
  bot:
    # Токен берётся из переменной окружения
    token: ${TELEGRAM_BOT_TOKEN}

downloader:
  yt-dlp-path: yt-dlp
  work-dir: ${java.io.tmpdir}/reels-bot
  timeout: 2m
  max-height: 720
  # Сколько видео одновременно скачиваются и отправляются, остальные ждут в очереди
  max-concurrent-downloads: 20

limits:
  antispam:
    # Больше max-messages сообщений за window — бот перестаёт отвечать человеку
    max-messages: 10
    window: 1m
    # Сколько бот молчит: в первый раз, во второй, в третий и дальше
    mutes: 15m, 1h, 24h
    # После стольких спокойных часов отсчёт снова начинается с первого срока
    forgive-after: 24h
  queue:
    # Сколько ссылок бот берёт в работу всего (качаются и ждут), следующим — «сервис перегружен»
    max-size: 100

logging:
  level:
    ru.telegramproject.reels: INFO
