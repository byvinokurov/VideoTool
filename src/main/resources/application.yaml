spring:
  application:
    name: ReelsProject
  # --- Временно, пока в проекте нет ни одной @Entity и БД не используется ---
  docker:
    compose:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

telegram:
  bot:
    # Токен берётся из переменной окружения
    token: ${TELEGRAM_BOT_TOKEN}

downloader:
  yt-dlp-path: yt-dlp
  work-dir: ${java.io.tmpdir}/reels-bot
  timeout: 2m
  max-height: 720
  # Сколько видео одновременно скачиваются и отправляются, остальные ждут в очереди
  max-concurrent-downloads: 4

logging:
  level:
    ru.telegramproject.reels: INFO
